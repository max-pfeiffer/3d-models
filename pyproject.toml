[project]
name = "3d-models"
version = "0.1.0"
description = "Parametric 3D models for Prusa printers, built with build123d"
requires-python = ">=3.12"
dependencies = [
    "build123d",
    "ocp-viewer",
    "trimesh",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadlib"]
